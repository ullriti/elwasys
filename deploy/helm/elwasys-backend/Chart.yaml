apiVersion: v2
name: elwasys-backend
description: >-
  elwasys-Backend (Spring Boot) – Geschäftslogik, REST-API/WebSocket für Terminals,
  integriertes Admin-Portal-UI (Vaadin Flow, seit Phase 3 Teil des Backends - kein
  eigenständiges Portal-Modul mehr). Siehe docs/kb/05-migration-plan.md (Modernisierungsplan) und
  docs/kb/01-architecture.md im elwasys-Repo. Dieser Chart deployt AUSSCHLIESSLICH das Backend
  (Deployment/Service/Ingress/ConfigMap/Secret) - PostgreSQL wird bewusst nicht als
  Sub-Chart mitgeliefert, siehe die Begründung in values.yaml unter "database:" und in
  docs/kb/05-migration-plan.md ("Entscheidungen").
type: application
# Chart-Version und appVersion stehen hier bewusst auf Platzhaltern: beim Release setzt
# .github/workflows/release.yml sie über "helm package --version/--app-version" auf die von
# GitVersion berechnete Release-Version und pusht den Chart als OCI-Artefakt nach
# ghcr.io/<owner>/charts/elwasys-backend. Chart und Backend werden immer gemeinsam
# ausgeliefert - deshalb sind beide Versionen gekoppelt ("Chart 1.4.2 deployt Backend 1.4.2").
#
# Im Repo bleibt der Sentinel stehen, damit ein Deployment aus dem Checkout ohne
# "--set image.tag" am imageTag-Guard des Charts scheitert (templates/_helpers.tpl, Issue #89)
# statt still ein nicht existierendes GHCR-Image zu ziehen.
version: 0.0.0
appVersion: "0.0.0-local-development"
home: https://elwasys.de
sources:
  - https://github.com/ullriti/elwasys
keywords:
  - elwasys
  - laundry
  - spring-boot
maintainers:
  - name: elwasys
